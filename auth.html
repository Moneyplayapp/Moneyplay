{% extends "base.html" %}{% block content %}<div class="auth card"><h2>{{"Criar conta" if mode=="register" else "Entrar"}}</h2><form method="post">{% if mode=="register" %}<input name="name" placeholder="Seu nome" required>{% endif %}<input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Senha (mín. 6)" required><button class="btn">{{"Criar conta" if mode=="register" else "Entrar"}}</button></form><p>{% if mode=="register" %}<a href="/login">Já tenho conta</a>{% else %}<a href="/register">Criar conta</a>{% endif %}</p></div>{% endblock %}
